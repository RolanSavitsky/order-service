spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

application:
  config:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8080}

jwt:
  secret: ${JWT_SECRET:123456789123456789123456789123456789}

internal:
  api-key: ${INTERNAL_API_KEY:internal-key}