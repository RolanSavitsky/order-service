services:
  app:
    build: .
    container_name: order-service-app
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:?Set DB_HOST}
      DB_PORT: ${DB_PORT:?Set DB_PORT}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      USER_SERVICE_URL: ${USER_SERVICE_URL:?Set USER_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - order-network

  postgres:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - order-network

networks:
  order-network:
    driver: bridge

volumes:
  order_postgres_data: